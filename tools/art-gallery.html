<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Art gallery</title>
  <style>
    body { background: #38b764; color: #1a1c2c; font: 13px/1.3 system-ui; margin: 0; padding: 12px; }
    h1 { font-size: 16px; margin: 0 0 8px; }
    .grid { display: grid; grid-template-columns: max-content; gap: 10px; }
    .row { display: flex; align-items: flex-end; gap: 10px; }
    .label { width: 70px; font-weight: 700; }
    .label small { display: block; font-weight: 400; }
    canvas { image-rendering: pixelated; display: block; }
  </style>
</head>
<body>
  <h1>Tower and wall levels 1–10</h1>
  <div id="grid" class="grid"></div>
  <script type="module">
    import { shadowRows } from '../js/art.js';
    import { rowsToCanvas } from '../js/gfx.js';
    import { wallRows, WALL_LEVELS, WALL_N, WALL_E, WALL_S, WALL_W } from '../js/art-walls.js';
    import { towerRows, towerPalette, TOWER_H } from '../js/art-buildings.js';

    const SCALE = 2;
    const shadow = rowsToCanvas(shadowRows());
    const grid = document.getElementById('grid');

    function scaled(w, h) {
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.style.width = `${w * SCALE}px`; c.style.height = `${h * SCALE}px`;
      const ctx = c.getContext('2d');
      ctx.imageSmoothingEnabled = false;
      return [c, ctx];
    }

    // A 3×3 ring of connected walls with the middle open, plus a lone piece.
    const RING = [
      [WALL_E | WALL_S, WALL_E | WALL_W, WALL_W | WALL_S],
      [WALL_N | WALL_S, 0, WALL_N | WALL_S],
      [WALL_N | WALL_E, WALL_E | WALL_W, WALL_N | WALL_W],
    ];
    const tower = towerRows();

    for (let level = 1; level <= 10; level++) {
      const row = document.createElement('div');
      row.className = 'row';
      const label = document.createElement('div');
      label.className = 'label';
      label.innerHTML = `Level ${level}<small>${WALL_LEVELS[level - 1].name}</small>`;
      row.append(label);

      const [tc, tctx] = scaled(24, TOWER_H);
      tctx.drawImage(shadow, 0, TOWER_H - 24);
      tctx.drawImage(rowsToCanvas(tower, towerPalette(level)), 0, 0);
      row.append(tc);

      const [wc, wctx] = scaled(72, 72);
      RING.forEach((r, y) => r.forEach((mask, x) => {
        if (y === 1 && x === 1) return;
        wctx.drawImage(rowsToCanvas(wallRows(level, mask)), x * 24, y * 24);
      }));
      row.append(wc);

      const [lc, lctx] = scaled(24, 24);
      lctx.drawImage(rowsToCanvas(wallRows(level, 0)), 0, 0);
      row.append(lc);

      grid.append(row);
    }
  </script>
</body>
</html>
