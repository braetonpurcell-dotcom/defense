<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Jukebox</title>
  <style>
    body { background: #1a1c2c; color: #e6e8ee; font: 14px/1.4 system-ui; margin: 0; padding: 16px; }
    h1 { font-size: 18px; margin: 0 0 4px; }
    p { color: #9097a8; margin: 0 0 12px; }
    .song { display: flex; align-items: center; gap: 10px; margin: 6px 0; }
    .song .name { width: 140px; }
    button { font: inherit; padding: 6px 12px; border-radius: 6px; border: 1px solid #566c86; background: #272b36; color: #e6e8ee; cursor: pointer; }
    button.playing { background: #f2b544; color: #1b1404; border-color: #f2b544; }
    #steps { display: grid; grid-template-columns: repeat(16, 14px); gap: 3px; margin-top: 14px; }
    #steps div { height: 14px; background: #272b36; border-radius: 2px; }
    #steps div.on { background: #6fcf6f; }
    #steps div.beat { background: #353a48; }
    label { color: #9097a8; }
  </style>
</head>
<body>
  <h1>Jukebox</h1>
  <p>Chiptunes for Defense, played by a little sound chip written in code. Pick one.</p>
  <div id="list"></div>
  <div class="song"><button id="stop">Stop</button><label>Volume <input id="vol" type="range" min="0" max="1" step="0.05" value="0.6"></label></div>
  <div id="steps"></div>
  <script type="module">
    import { SONGS, createPlayer } from './chip.js';
    const player = createPlayer();
    window.jukebox = { player, SONGS };

    const list = document.getElementById('list');
    const buttons = {};
    for (const [key, song] of Object.entries(SONGS)) {
      const row = document.createElement('div');
      row.className = 'song';
      const btn = document.createElement('button');
      btn.textContent = 'Play';
      btn.addEventListener('click', () => { player.play(song); refresh(); });
      buttons[key] = btn;
      const name = document.createElement('span');
      name.className = 'name';
      name.textContent = song.name;
      const info = document.createElement('span');
      info.textContent = `${song.bpm} bpm, ${song.tracks.length} channels${song.loop ? ', loops' : ''}`;
      row.append(name, btn, info);
      list.append(row);
    }
    document.getElementById('stop').addEventListener('click', () => { player.stop(); refresh(); });
    document.getElementById('vol').addEventListener('input', (e) => { player.volume = Number(e.target.value); });

    const steps = document.getElementById('steps');
    for (let i = 0; i < 16; i++) { const d = document.createElement('div'); if (i % 4 === 0) d.classList.add('beat'); steps.append(d); }

    function refresh() {
      for (const [key, btn] of Object.entries(buttons)) btn.classList.toggle('playing', player.playing && player.song === SONGS[key]);
    }
    setInterval(() => {
      const s = player.playing ? player.step % 16 : -1;
      [...steps.children].forEach((d, i) => d.classList.toggle('on', i === s));
      if (!player.playing) refresh();
    }, 40);
  </script>
</body>
</html>
